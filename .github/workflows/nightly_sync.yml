name: Nightly Data Sync

on:
  schedule:
    - cron: '0 1 * * *'  # Runs every night at 1am UTC
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Sync all 3 seasons (slow, for backfill)'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Sportmonks sync
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          SPORTMONKS_API_KEY: ${{ secrets.SPORTMONKS_API_KEY }}
          FULL_SYNC: ${{ inputs.full_sync == true && '1' || '0' }}
        run: python scripts/sync_sportmonks.py

      - name: Run football-data sync
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FULL_SYNC: ${{ inputs.full_sync == true && '1' || '0' }}
        run: python scripts/sync_football_data.py

      - name: Run API-Sports sync
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          FULL_SYNC: ${{ inputs.full_sync == true && '1' || '0' }}
        run: python scripts/sync_api_sports.py

      - name: Build form and H2H cache
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: python scripts/build_form_cache.py

      - name: Build Dixon-Coles team ratings
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: python scripts/build_ratings.py

      - name: Build fixture scores
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: python scripts/build_fixture_scores.py

      - name: Record weekend picks (Fridays only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "5" ]; then
            python scripts/record_weekend_picks.py
          else
            echo "Not Friday — skipping weekend pick recording"
          fi

      - name: Grade weekend picks (Mondays only)
        if: ${{ github.event_name == 'schedule' }}
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "1" ]; then
            python scripts/grade_weekend_picks.py
          else
            echo "Not Monday — skipping grading"
          fi
